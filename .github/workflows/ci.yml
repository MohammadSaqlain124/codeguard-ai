name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:prod

  detector:
    name: Detector lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/detector/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

# The integration suite is deliberately absent. apps/api's vitest run needs
# Mongo, Redis and an object store, and it reads infra/.env, which is not in
# the repository. Adding it means putting those credentials into GitHub
# secrets and writing infra/.env at run time, then starting the stack with
# docker compose rather than Actions services, because a service container
# cannot be given the "server /data" command the object store needs.
