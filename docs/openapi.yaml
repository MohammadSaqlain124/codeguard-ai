openapi: 3.0.3

# GENERATED BY HAND from the route files and Zod schemas, 14 November 2026.
# Source of truth: apps/api/src/routes/*.ts and apps/api/src/validation/*.ts.
# If a route changes, this file does not follow automatically. Check it
# against the routes before trusting it.
#
# View it with any of:
#   https://editor.swagger.io            paste the file in
#   npx @redocly/cli preview-docs docs/openapi.yaml
#   VS Code extension "OpenAPI (Swagger) Editor"

info:
  title: CodeGuard AI API
  version: "0.1.0"
  description: |
    Authorship-evidence API. Every response that carries a Review Priority
    Score is staff-only; the student-facing endpoint deliberately returns no
    score at all.

    **Authentication.** POST /api/auth/login returns an access token. Send it
    as `Authorization: Bearer <token>` on everything else. Access tokens are
    short-lived; POST /api/auth/refresh exchanges a refresh token for a new one.

    **Roles.** student, faculty, admin. Where a route is staff-only the guard
    is noted on the operation. Some staff-only routes answer **404 rather than
    403** on purpose: a 403 would confirm the record exists.

servers:
  - url: http://localhost:4000
    description: local development

tags:
  - name: auth
    description: Sign-in, tokens, and account administration
  - name: courses
    description: Courses, enrolment, and per-course detection settings
  - name: assignments
    description: Assignments and the review queue
  - name: submissions
    description: Uploads, results, evidence and review decisions

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
      description: A MongoDB ObjectId, exactly 24 hexadecimal characters.
      example: 6af81d598cab57ab5f4788ab

    Role:
      type: string
      enum: [student, faculty, admin]

    SubmissionStatus:
      type: string
      enum: [uploaded, queued, analyzing, analyzed, failed]

    ReviewDecision:
      type: string
      enum: [dismissed, contested, escalated, confirmed_clean]
      description: >
        The four states a reviewer can move a result into. "pending" is absent
        on purpose: there is no audit action for reopening to pending.

    Error:
      type: object
      description: >
        Every failure uses this shape. requestId also appears in the server
        log, so a client can quote it when reporting a problem.
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: UNAUTHENTICATED
            message:
              type: string
              example: Authentication required
            requestId:
              type: string
              format: uuid
            details:
              description: Present on validation failures.
      required: [error]

    Pagination:
      type: object
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        total: { type: integer }

    User:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        rollNo:
          type: string
          nullable: true
          description: Students only.
        isActive: { type: boolean }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }

    Submission:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        assignmentId: { $ref: '#/components/schemas/ObjectId' }
        studentId: { $ref: '#/components/schemas/ObjectId' }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        attempt: { type: integer }
        isLate: { type: boolean }
        filename: { type: string }
        createdAt: { type: string, format: date-time }

    LayerEvidence:
      type: object
      description: >
        One layer's contribution. status is "scored" when the layer ran,
        "skipped" when it declined, with reason saying why.
      properties:
        status:
          type: string
          enum: [scored, skipped]
        reason: { type: string, nullable: true }
        score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true

    DetectionResult:
      type: object
      description: >
        The full evidence behind one score. STAFF ONLY. Render the caveats
        before the number: a score shown without them is the failure mode the
        whole system is built to avoid.
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        submissionId: { $ref: '#/components/schemas/ObjectId' }
        revision: { type: integer, minimum: 1 }
        rps:
          type: number
          minimum: 0
          maximum: 1
          description: Review Priority Score. Orders a queue; it is not a verdict.
        structural: { $ref: '#/components/schemas/LayerEvidence' }
        behavioral: { $ref: '#/components/schemas/LayerEvidence' }
        aiContent:
          allOf: [{ $ref: '#/components/schemas/LayerEvidence' }]
          description: Layer 3. Currently always status "skipped".
        weights:
          type: object
          description: The weights that produced THIS result, stored with it.
          properties:
            w1: { type: number }
            w2: { type: number }
            w3: { type: number }
            effectiveW2: { type: number }
        reviewThreshold: { type: number }
        configVersion: { type: integer }
        review:
          type: object
          nullable: true
          properties:
            status: { $ref: '#/components/schemas/ReviewDecision' }
            note: { type: string }
            studentExplanation: { type: string, nullable: true }

    StudentView:
      type: object
      description: >
        What a student may see about their own submission. Contains NO score,
        and the endpoint does not return one — this is enforced by the API,
        not by the client choosing not to display it.
      properties:
        submissionId: { $ref: '#/components/schemas/ObjectId' }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        isLate: { type: boolean }
        attempt: { type: integer }
        decision:
          type: string
          nullable: true
          description: Present only once a reviewer has recorded one.
        studentExplanation: { type: string, nullable: true }

  parameters:
    page:
      { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    courseId:
      { name: courseId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
    assignmentId:
      { name: assignmentId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
    submissionId:
      { name: submissionId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
    userId:
      { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }

  responses:
    Unauthenticated:
      description: No token, or the token is invalid or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Signed in, but the role is not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        Not found — or found but not yours. Several staff-only routes answer
        404 instead of 403 so that the record's existence is not confirmed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: The request did not match its schema.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------- auth
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a student account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, minLength: 3, maxLength: 254 }
                password: { type: string }
                name: { type: string, minLength: 2, maxLength: 120 }
                rollNo: { type: string }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        "400": { $ref: '#/components/responses/ValidationFailed' }
        "409":
          description: That email or roll number is already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429":
          description: Rate limited per IP.

  /api/auth/login:
    post:
      tags: [auth]
      summary: Sign in and receive a token pair
      description: >
        Rate limited per IP and per email. Returns the same message for a
        wrong password and an unknown email, so the response does not reveal
        which accounts exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        "401": { $ref: '#/components/responses/Unauthenticated' }
        "429":
          description: Too many attempts.

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 1 }
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        "401": { $ref: '#/components/responses/Unauthenticated' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 1 }
      responses:
        "204": { description: Signed out. }

  /api/auth/me:
    get:
      tags: [auth]
      summary: The signed-in account
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { $ref: '#/components/responses/Unauthenticated' }

  /api/auth/users:
    get:
      tags: [auth]
      summary: List accounts
      description: Admin only. An account list names every student in the institution.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [auth]
      summary: Create an account
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role]
              properties:
                email: { type: string }
                password: { type: string }
                name: { type: string, minLength: 2, maxLength: 120 }
                role: { $ref: '#/components/schemas/Role' }
                rollNo: { type: string, description: Required when role is student. }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/auth/users/{userId}:
    patch:
      tags: [auth]
      summary: Change a role or disable an account
      description: >
        Admin only, and an admin may not change their own account. The reason
        is required and is written to the audit log.
      parameters: [{ $ref: '#/components/parameters/userId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
                rollNo: { type: string }
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "400": { $ref: '#/components/responses/ValidationFailed' }
        "403": { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------- courses
  /api/courses:
    get:
      tags: [courses]
      summary: List courses visible to the signed-in user
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        "200": { description: A page of courses. }
        "401": { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [courses]
      summary: Create a course
      description: Faculty or admin.
      responses:
        "201": { description: Created. }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/courses/{courseId}:
    get:
      tags: [courses]
      summary: One course
      parameters: [{ $ref: '#/components/parameters/courseId' }]
      responses:
        "200": { description: The course. }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [courses]
      summary: Update a course
      description: Faculty or admin.
      parameters: [{ $ref: '#/components/parameters/courseId' }]
      responses:
        "200": { description: Updated. }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/courses/{courseId}/students:
    post:
      tags: [courses]
      summary: Enrol students
      description: Faculty or admin.
      parameters: [{ $ref: '#/components/parameters/courseId' }]
      responses:
        "200": { description: Enrolled. }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/courses/{courseId}/students/remove:
    post:
      tags: [courses]
      summary: Remove students from a course
      description: >
        POST rather than DELETE because some clients and proxies drop a
        DELETE request's body.
      parameters: [{ $ref: '#/components/parameters/courseId' }]
      responses:
        "200": { description: Removed. }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/courses/{courseId}/config:
    get:
      tags: [courses]
      summary: Detection settings for a course
      description: >
        Staff only on the read as well as the write, unlike every other course
        read: the review threshold tells a student exactly how much copying
        stays out of the queue.
      parameters: [{ $ref: '#/components/parameters/courseId' }]
      responses:
        "200": { description: The weights and threshold. }
        "403": { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [courses]
      summary: Change detection settings
      parameters: [{ $ref: '#/components/parameters/courseId' }]
      responses:
        "200": { description: Updated. }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/courses/{courseId}/assignments:
    get:
      tags: [assignments]
      summary: Assignments in a course
      parameters:
        - { $ref: '#/components/parameters/courseId' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        "200": { description: A page of assignments. }
    post:
      tags: [assignments]
      summary: Create an assignment
      description: Faculty or admin.
      parameters: [{ $ref: '#/components/parameters/courseId' }]
      responses:
        "201": { description: Created. }
        "403": { $ref: '#/components/responses/Forbidden' }

  # --------------------------------------------------------- assignments
  /api/assignments/{assignmentId}:
    get:
      tags: [assignments]
      summary: One assignment
      parameters: [{ $ref: '#/components/parameters/assignmentId' }]
      responses:
        "200": { description: The assignment. }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [assignments]
      summary: Update an assignment
      description: Faculty or admin.
      parameters: [{ $ref: '#/components/parameters/assignmentId' }]
      responses:
        "200": { description: Updated. }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/assignments/{assignmentId}/results:
    get:
      tags: [assignments]
      summary: THE REVIEW QUEUE — results for an assignment, ranked
      description: >
        Staff only. This is the screen the mobile app's queue is built from.
        A student asking for it receives 404, not 403.
      parameters:
        - { $ref: '#/components/parameters/assignmentId' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
        - name: reviewStatus
          in: query
          schema: { type: string }
          description: Filter by review state.
        - name: minRps
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
          description: Only results at or above this score.
      responses:
        "200":
          description: A ranked page of results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DetectionResult' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/assignments/{assignmentId}/submissions:
    get:
      tags: [submissions]
      summary: Submissions to an assignment
      description: >
        Staff see everyone's; a student sees their own. The student and late
        filters are staff filters and are ignored for students.
      parameters:
        - { $ref: '#/components/parameters/assignmentId' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SubmissionStatus' }
        - name: student
          in: query
          schema: { $ref: '#/components/schemas/ObjectId' }
        - name: late
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: A page of submissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Submission' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [submissions]
      summary: Upload a submission
      description: >
        Students only. Type and size are enforced server-side. Rate limited
        per user. A second upload while one is in flight receives 409.
      parameters: [{ $ref: '#/components/parameters/assignmentId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored and queued for detection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409":
          description: >
            Attempts exhausted, the deadline has passed, or another upload for
            this assignment is already in progress.
        "415":
          description: The assignment expects a different file type.
        "429":
          description: Rate limited per user.

  # --------------------------------------------------------- submissions
  /api/submissions/{submissionId}:
    get:
      tags: [submissions]
      summary: One submission's details
      parameters: [{ $ref: '#/components/parameters/submissionId' }]
      responses:
        "200":
          description: The submission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/submissions/{submissionId}/file:
    get:
      tags: [submissions]
      summary: Download the submitted source file
      parameters: [{ $ref: '#/components/parameters/submissionId' }]
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/submissions/{submissionId}/result:
    get:
      tags: [submissions]
      summary: THE EVIDENCE — the full result behind one score
      description: >
        Staff only, enforced in the controller rather than by a role guard, so
        a student receives 404 and not 403. Results are versioned rather than
        overwritten; omit revision for the current one.

        The mobile evidence screen is built from this. Show the caveats before
        the number.
      parameters:
        - { $ref: '#/components/parameters/submissionId' }
        - name: revision
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The result and both layers' evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectionResult' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/submissions/{submissionId}/student-view:
    get:
      tags: [submissions]
      summary: What a student may see about their own submission
      description: >
        Returns NO score. A faculty member checking what a student can see is
        a valid use of this too, which is why it is named for what it returns
        rather than for who asks.
      parameters: [{ $ref: '#/components/parameters/submissionId' }]
      responses:
        "200":
          description: Status and any recorded decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentView' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/submissions/{submissionId}/explanation:
    patch:
      tags: [submissions]
      summary: A student's answer to a decision recorded about them
      parameters: [{ $ref: '#/components/parameters/submissionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [explanation]
              properties:
                explanation: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200": { description: Recorded. }
        "400": { $ref: '#/components/responses/ValidationFailed' }

  /api/submissions/{submissionId}/review:
    patch:
      tags: [submissions]
      summary: RECORD A DECISION about a result
      description: >
        Faculty or admin. The note is required and is written to the audit log
        with it. This is the mobile app's decision action.
      parameters: [{ $ref: '#/components/parameters/submissionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note]
              properties:
                status: { $ref: '#/components/schemas/ReviewDecision' }
                note: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200": { description: Decision recorded. }
        "400": { $ref: '#/components/responses/ValidationFailed' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/submissions/{submissionId}/nominate:
    post:
      tags: [submissions]
      summary: Nominate a submission as a style anchor
      description: >
        Faculty or admin. Changes what a student's baseline is built from, so
        the reason is required.
      parameters: [{ $ref: '#/components/parameters/submissionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200": { description: Nominated. }
        "403": { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [submissions]
      summary: Withdraw a nomination
      description: Faculty or admin. Sends a body, same shape as the nomination.
      parameters: [{ $ref: '#/components/parameters/submissionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200": { description: Withdrawn. }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/submissions/{submissionId}/rerun:
    post:
      tags: [submissions]
      summary: Re-run detection, creating a new revision
      description: >
        Faculty or admin. Supersedes a stored score with a new revision; the
        old one stays in the history, so the reason is required. Refused while
        the worker is mid-analysis.
      parameters: [{ $ref: '#/components/parameters/submissionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "202": { description: Queued for re-analysis. }
