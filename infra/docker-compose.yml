#infra/docker-compose.yml

name: codeguard

services:
  mongo:
    image: mongo:7
    container_name: codeguard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: codeguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # Silo is the community AGPL fork of MinIO, maintained by Pigsty.
    # MinIO removed minio/minio from Docker Hub in September 2026 and closed
    # anonymous pulls on quay, and its commercial successor denies every S3
    # operation without a licence file. Silo keeps the MINIO_* variables, the
    # command syntax and the S3 API, so nothing outside this file changes.
    # Pinned by digest rather than tag: a tag can be moved to different bytes,
    # a digest cannot.
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: codeguard-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ../apps/api
    container_name: codeguard-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The production image installs without dev dependencies, so pino-pretty
      # is not present. env.ts defaults NODE_ENV to development, which made the
      # logger ask pino for it and throw at module load, so this container had
      # been restarting in a loop. Only this service is overridden, so the host
      # still reads NODE_ENV=development from .env and keeps readable logs.
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      DETECTOR_URL: http://detector:8000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    # longer than the 10s force-exit timer in server.ts, so our own timer wins
    # see the worker service: without this, StopSignal is empty and docker
    # compose stop waits out the grace period and SIGKILLs instead
    stop_signal: SIGTERM
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    # The same build context as the api on purpose. The Dockerfile's build
    # stage compiles all of src, so dist/worker.js is already in that image
    # and no second Dockerfile is needed. Building it twice costs nothing:
    # identical context and identical steps mean every layer is a cache hit.
    build:
      context: ../apps/api
    container_name: codeguard-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Every override below is here for the same reason as the api's, and
      # NODE_ENV most of all: the worker imports config/logger.js too, so
      # without this it would ask the production image for pino-pretty and
      # restart-loop exactly as the api did.
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      DETECTOR_URL: http://detector:8000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Unlike the api, which serves plenty of routes that never touch the
      # detector. Every analyse job calls it, so starting first would just
      # burn the three attempts in detectionQueue.ts against a port that is
      # not listening yet.
      detector:
        condition: service_healthy
    command: ["node", "dist/worker.js"]
    # No ports and no healthcheck. It serves nothing, and a check that only
    # proved the process was alive would report "healthy" for a worker wedged
    # on a job, which is worse than admitting there is no check.
    #
    # worker.close() waits for the jobs in flight, and one analyse job can sit
    # on the detector for DETECTOR_TIMEOUT_MS, which defaults to 30000. There
    # is no internal force-exit timer here as there is in server.ts, so this is
    # the only backstop: at the 10s default Docker would SIGKILL mid-analysis
    # and leave the submission stuck at "analyzing", which nothing recovers.
    # docker inspect reported an empty StopSignal, and docker compose stop was
    # then waiting out the whole grace period and sending SIGKILL, while an
    # explicit SIGTERM shut the worker down in 9ms. Stated here so the stop
    # path cannot fall through to the timeout.
    stop_signal: SIGTERM
    stop_grace_period: 45s

  detector:
    build:
      context: ../apps/detector
    container_name: codeguard-detector
    restart: unless-stopped
    # the api gets this from env_file; the detector has no env_file, so it is
    # passed explicitly. compose interpolates it from infra/.env
    environment:
      DETECTOR_TOKEN: ${DETECTOR_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    stop_signal: SIGTERM
    # above uvicorn's own --timeout-graceful-shutdown of 30s, so the service
    # ends its own requests rather than being SIGKILLed partway
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  redis_data:
  minio_data:
